# JVM options for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required (AppCompat + WebKit's WebViewAssetLoader)
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# App version — read by app/build.gradle.
# Play Console requires versionCode to strictly increase with EVERY upload, so
# bump it (1 -> 2 -> 3 ...) before each new release; versionName is the
# human-readable version users see (1.0, 1.0.1, 1.1 ...). You can also override
# per build from the command line: ./gradlew bundleRelease -Pghostmesh.versionCode=7
# ---------------------------------------------------------------------------
ghostmesh.versionCode=1
ghostmesh.versionName=1.0
